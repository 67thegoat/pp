  <script>
    const productNames = [
		"Bearing",
      "Machine Hose Pipe", "Machine Hose Pipe Manual", "Multibrand Store in MP", "Multibrand Store in MP2", 
	  "Multibrand Store in Rajasthan","Our product Undercarriage at store", "PIN-KIT","Quality Test PIN"

    ];

    function sanitizeFilename(name) {
      return name
        .toLowerCase()
        .replace(/[,\/&]/g, '')        // remove special characters
        .replace(/\s+/g, '-')          // replace spaces with hyphens
        .replace(/-+/g, '-')           // avoid duplicate hyphens
        .trim();
    }

    function createPlaceholder(name) {
      const label = (name || 'GALLERY').toUpperCase().slice(0, 24);
      const hash = [...label].reduce((sum, char) => sum + char.charCodeAt(0), 0);
      const hue = hash % 360;
      const colorA = `hsl(${hue} 60% 92%)`;
      const colorB = `hsl(${(hue + 48) % 360} 60% 84%)`;
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="400" height="260">
          <defs>
            <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="${colorA}"/>
              <stop offset="100%" stop-color="${colorB}"/>
            </linearGradient>
          </defs>
          <rect width="400" height="260" rx="24" fill="url(#g)"/>
          <rect x="24" y="24" width="352" height="212" rx="20" fill="rgba(255,255,255,0.75)"/>
          <text x="200" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#5c0c5c">${label}</text>
          <text x="200" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#8b2c8b">Image coming soon</text>
        </svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    productNames.forEach((name, index) => {
      const fileName = sanitizeFilename(name) + ".webp";
      document.write(`
        <div class="product" id="${index}" >
          <img src="images/imagegallery/${fileName}" alt="${name}" onerror="this.onerror=null;this.src='${createPlaceholder(name)}';">
          <p id="productlabel">${name}</p>
        </div>
      `);
    });
  </script>
